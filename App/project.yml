name: RemoteDesktop
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    iOS: "17.0"
packages:
  ScreenShareKit:
    path: ..
targets:
  RemoteDesktop:
    type: application
    platform: iOS
    sources: [RemoteDesktop]
    dependencies:
      - package: ScreenShareKit
    info:
      path: RemoteDesktop/Info.plist
      properties:
        NSBonjourServices: ["_rfb._tcp"]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: RemoteDesktop/RemoteDesktop.entitlements
      properties:
        # Without a keychain group the Mac build has no keychain to save passwords in.
        keychain-access-groups: ["$(AppIdentifierPrefix)dev.local.RemoteDesktop"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.RemoteDesktop
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Remote Desktop
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Remote Desktop connects to Macs on your local network to show and control their screens.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
